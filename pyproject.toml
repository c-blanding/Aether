[project]
name = "aether-sim"
version = "1.0.1"
description = "Python SDK for persistent, character-driven simulations with action/event rules and optional LLM interact loops."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "c-blanding", email = "b.blanding90@yahoo.com" }
]
requires-python = ">=3.11"
keywords = [
    "simulation",
    "npc",
    "interactive-fiction",
    "game-ai",
    "langgraph",
    "characters",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/c-blanding/Aether"
Issues = "https://github.com/c-blanding/Aether/issues"
Changelog = "https://github.com/c-blanding/Aether/blob/dev/CHANGELOG.md"
Documentation = "https://github.com/c-blanding/Aether#readme"

[project.optional-dependencies]
ai = [
    "langchain-core>=0.3.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "python-dotenv>=1.0.0",
]
postgres = [
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.0.0",
]
all = [
    "aether-sim[ai,postgres]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aether"
